table: directus_deployment_impact_reports

fields:
  - field: id
    special: [uuid]
  - field: deployment
  - field: deployment_project
  - field: deployment_run
  - field: status
  - field: attempts
  - field: requested_snapshot
  - field: requested_permissions
  - field: result
  - field: error
  - field: started_at
    special: [cast-timestamp]
  - field: completed_at
    special: [cast-timestamp]
  - field: expires_at
    special: [cast-timestamp]
  - field: date_created
    special: [date-created, cast-timestamp]
  - field: date_updated
    special: [date-updated, cast-timestamp]
  - field: user_created
    special: [user-created]

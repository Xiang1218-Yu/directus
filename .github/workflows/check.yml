name: Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # Re-trigger so toggling the 'Skip Checks' label re-evaluates the required checks
      - labeled
      - unlabeled

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  # Figures out which checks the changed files actually require and fans the
  # result out to the jobs below. The selection logic lives in
  # scripts/ci-select-checks.mjs so it can be reproduced locally with
  # `pnpm ci:select`.
  changes:
    name: Detect Changes
    if: ${{ ! contains(github.event.pull_request.labels.*.name, 'Skip Checks') }}
    runs-on: ubuntu-latest
    outputs:
      global: ${{ steps.select.outputs.global }}
      lint: ${{ steps.select.outputs.lint }}
      format: ${{ steps.select.outputs.format }}
      stylelint: ${{ steps.select.outputs.stylelint }}
      typecheck: ${{ steps.select.outputs.typecheck }}
      unit: ${{ steps.select.outputs.unit }}
      e2e: ${{ steps.select.outputs.e2e }}
      lint_files: ${{ steps.select.outputs.lint_files }}
      format_files: ${{ steps.select.outputs.format_files }}
      style_files: ${{ steps.select.outputs.style_files }}
      unit_filters: ${{ steps.select.outputs.unit_filters }}
      typecheck_filters: ${{ steps.select.outputs.typecheck_filters }}
      build_filters: ${{ steps.select.outputs.build_filters }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so the script can diff against the merge base
          fetch-depth: 0

      - name: Select checks
        id: select
        run:
          node scripts/ci-select-checks.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.sha }}"

  lint:
    name: Lint
    needs: changes
    if:
      ${{ ! contains(github.event.pull_request.labels.*.name, 'Skip Checks') && needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          build: false

      - name: Run Linter
        run: |
          if [ "${{ needs.changes.outputs.global }}" = "true" ]; then
            # Shared lint/CI configuration changed — check the whole repo
            pnpm lint
          else
            pnpm exec eslint ${{ needs.changes.outputs.lint_files }}
          fi

  stylelint:
    name: Stylelint
    needs: changes
    if:
      ${{ ! contains(github.event.pull_request.labels.*.name, 'Skip Checks') && needs.changes.outputs.stylelint ==
      'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          build: false

      - name: Run Stylelinter
        run: |
          if [ "${{ needs.changes.outputs.global }}" = "true" ]; then
            pnpm lint:style
          else
            pnpm exec stylelint ${{ needs.changes.outputs.style_files }} --allow-empty-input
          fi

  format:
    name: Format
    needs: changes
    if:
      ${{ ! contains(github.event.pull_request.labels.*.name, 'Skip Checks') && needs.changes.outputs.format == 'true'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          build: false

      - name: Run Formatter
        run: |
          if [ "${{ needs.changes.outputs.global }}" = "true" ]; then
            pnpm format
          else
            pnpm exec prettier --check --ignore-unknown ${{ needs.changes.outputs.format_files }}
          fi

  typecheck:
    name: Type Check
    needs: changes
    if:
      ${{ ! contains(github.event.pull_request.labels.*.name, 'Skip Checks') && needs.changes.outputs.typecheck ==
      'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          filters: ${{ needs.changes.outputs.build_filters }}

      - name: Run Type Checks
        run: |
          if [ "${{ needs.changes.outputs.global }}" = "true" ]; then
            pnpm --recursive run typecheck
          else
            pnpm --recursive ${{ needs.changes.outputs.typecheck_filters }} run typecheck
          fi

  unit:
    name: Unit Tests
    needs: changes
    if:
      ${{ ! contains(github.event.pull_request.labels.*.name, 'Skip Checks') && needs.changes.outputs.unit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Only the affected workspaces and their dependencies are built. Tests
      # still use the built @directus/* packages, so the build scope has to
      # include the dependency closure of the tested workspaces.
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          filters: ${{ needs.changes.outputs.build_filters }}

      - name: Run Tests
        run: |
          if [ "${{ needs.changes.outputs.global }}" = "true" ]; then
            pnpm test:coverage --passWithNoTests
          else
            pnpm --recursive ${{ needs.changes.outputs.unit_filters }} test:coverage --passWithNoTests
          fi

      - name: Upload coverage to Codecov
        continue-on-error: true
        run: |
          # Download and install Codecov uploader
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Find all coverage files and upload them with flags based on folder names
          find . -name "coverage-final.json" -path "*/coverage/*" | while read -r coverage_file; do
            # Extract the folder name that contains the coverage directory
            folder_name=$(echo "$coverage_file" | sed -E 's|.*/(.*)/coverage/.*|\1|')
            echo "Uploading coverage for $folder_name from $coverage_file"

            # Upload to codecov with folder name as flag
            ./codecov upload-coverage -f "$coverage_file" -F "$folder_name" -Z --disable-search
          done

  # Single place that aggregates the (possibly skipped) jobs above, so a PR
  # has one unambiguous signal and skipped jobs don't count as failures.
  check-summary:
    name: Check Summary
    if: ${{ always() }}
    needs:
      - changes
      - lint
      - stylelint
      - format
      - typecheck
      - unit
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          failed=$(echo "$NEEDS" | jq '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length')

          if [ "$failed" -gt 0 ]; then
            echo "::error::One or more checks failed or were cancelled"
            exit 1
          fi
